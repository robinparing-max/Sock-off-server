<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sock Off – Toe Polish Casino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#1c0f14;--panel:#2a171e;--line:#4a2d38;--text:#f6e9dc;--mute:#b99aa0;--lamp:#f5b95f;--win:#7fd99a;--lose:#ff8c82;
--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;color-scheme:dark;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh;
background-image:radial-gradient(60% 40% at 50% 0%,rgba(245,185,95,.16),transparent 70%)}
main{max-width:520px;margin:0 auto;padding:14px 14px 28px}
.top{display:flex;justify-content:center;align-items:baseline;margin-bottom:10px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
.bal{font-size:15px;color:var(--mute)}.bal b{color:var(--lamp);font-size:20px;font-weight:800}
.stage{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
.stage video,.stage #res{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{object-position:80% 50%}
.stage #res{opacity:0;transform-origin:55% 82%;transform:scale(1)}
.stage #res.show{opacity:1;transform:scale(1.14);transition:transform 9s linear}
.badge{position:absolute;left:22%;top:22%;max-width:42%;text-align:center;transform:translate(-50%,calc(-50% - 8px)) rotate(-30deg);padding:7px 14px;border-radius:99px;background:rgba(20,10,14,.82);
font-weight:800;font-size:15px;line-height:1.25;opacity:0;transition:.4s;backdrop-filter:blur(6px)}
.badge.on{opacity:1;transform:translate(-50%,-50%) rotate(-30deg)}.badge.w{color:var(--win)}.badge.l{color:var(--lose)}
.hist{display:flex;gap:6px;min-height:18px;margin:10px 2px 4px;align-items:center;color:var(--mute);font-size:13px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
section{margin-top:14px}
.lbl{font-size:14px;color:var(--mute);margin:0 0 7px;font-weight:500;text-align:center}
.row{display:flex;gap:8px}
button{font:inherit;color:var(--text);cursor:pointer}
.seg button{flex:1;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:15px}
.seg button[aria-pressed=true]{background:var(--lamp);color:#2a1408;border-color:var(--lamp)}
.picks{display:grid;gap:8px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);text-align:left;width:100%}
.pick[aria-pressed=true]{border-color:var(--lamp);background:#3a2028}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:none}
.pick .n{font-weight:700;font-size:17px;flex:1}.pick .o{color:var(--lamp);font-weight:800}
.bets{align-items:stretch}
.bets input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:800;font-size:18px}
.bets input:focus{border-color:var(--lamp);outline:none}
.bets button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:15px}
.logo{position:absolute;left:12px;bottom:12px;height:20%;width:auto;opacity:.5;pointer-events:none;z-index:2}
.go{width:100%;margin-top:16px;padding:16px;border-radius:16px;border:0;background:var(--lamp);color:#2a1408;font-weight:800;font-size:19px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.info{text-align:center;margin-top:12px;font-size:13px;color:var(--mute);line-height:1.5}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px;padding:4px 0}
@media (prefers-reduced-motion:reduce){.stage #res.show{transition:none;transform:scale(1)}}
</style>
</head>

 opts().forEach(function(k){var b=document.createElement("button");b.className="pick";b.setAttribute("aria-pressed",st.pick===k);
  b.innerHTML='<span class="sw" style="background:'+COLORS[k].c+'"></span><span class="n">'+COLORS[k].n+'</span><span class="o">\u00d7'+M()+'</span>';
  b.onclick=function(){if(st.busy)return;st.pick=k;render()};b.disabled=st.busy;$("picks").appendChild(b)});
 ["bet","half","dbl","clr"].forEach(function(id){$(id).disabled=st.busy||st.bal===null});
 var g=$("go");g.disabled=st.busy||!st.pick||!st.token||st.bal===null||st.bet<=0||st.bet>st.bal;
 g.textContent=!st.token?"Connecting...":st.busy?"Wait...":(!st.pick?"Pick a color":st.bet<=0?"Enter a bet":"Take the sock off \u00b7 "+st.bet.toFixed(2));
 $("hist").innerHTML=st.hist.length?"Last results":"";
 st.hist.slice(-10).forEach(function(h){var d=document.createElement("span");d.className="dot";d.style.background=COLORS[h.r].c;d.style.borderColor=h.w?"#7fd99a":"#ff8c82";d.title=COLORS[h.r].n;$("hist").appendChild(d)});
}
function reset(){
 badge.className="badge";res.style.transition="none";res.className="";void res.offsetWidth;res.style.transition="";
 try{vid.currentTime=0}catch(e){}
}
function refreshBal(){return api("/api/balance",{token:st.token}).then(function(j){st.bal=fm(j.balance/100);render()}).catch(function(){})}
function connect(){
 var q=new URLSearchParams(location.search).get("token");
 say("Connecting to server...");
 (q?Promise.resolve({token:q}):api("/api/demo-session")).then(function(j){
  st.token=j.token;return api("/api/balance",{token:st.token});
 }).then(function(j){st.bal=fm(j.balance/100);badge.className="badge";render()})
 .catch(function(){setTimeout(connect,3000)});
}
function play(){
 if(st.busy||!st.pick||!st.token||st.bet<=0||st.bet>st.bal)return;
 st.busy=true;st.bal=fm(st.bal-st.bet);render();reset();
 var vDone=false,resp=null,failed=null,over=false;
 function fail(e){
  over=true;vid.pause();reset();st.busy=false;
  say(e&&e.message==="insufficient_funds"?"Not enough balance":"Round failed, bet refunded","l");
  refreshBal();
 }
 function reveal(j){
  over=true;res.src=COLORS[j.result].img;res.className="show";var won=j.win>0;
  setTimeout(function(){
   st.bal=fm(j.balance/100);st.hist.push({r:j.result,w:won});st.busy=false;
   say(COLORS[j.result].n+" \u00b7 "+(won?"+"+fm((j.win-Math.round(st.bet*100))/100):"\u2212"+st.bet),won?"w":"l");render();
  },1200);
 }
 function check(){if(over)return;if(failed)return fail(failed);if(vDone&&resp)reveal(resp)}
 api("/api/play",{token:st.token,mode:st.mode,pick:st.pick,bet:Math.round(st.bet*100)})
  .then(function(j){resp=j;check()}).catch(function(e){failed=e;check()});
 vid.playbackRate=1.5;
 vid.onended=function(){vDone=true;check()};
 var p=vid.play();if(p&&p.catch)p.catch(function(){vDone=true;check()});
 setTimeout(function(){vDone=true;check()},7000);
}
$("modes").onclick=function(e){var m=e.target.dataset&&e.target.dataset.m;if(m&&!st.busy){st.mode=+m;render()}};
function setBet(v,write){v=Math.max(0,fm(v));if(st.bal!==null&&v>st.bal)v=fm(st.bal);st.bet=v;if(write)$("bet").value=v.toFixed(2);render()}
$("bet").oninput=function(){
 var t=this.value.replace(",",".").replace(/[^0-9.]/g,""),p=t.split(".");
 if(p.length>1)t=p[0]+"."+p.slice(1).join("").slice(0,2);
 if(t!==this.value)this.value=t;
 st.bet=Math.min(fm(parseFloat(t)||0),st.bal===null?Infinity:st.bal);render();
};
$("bet").onblur=function(){setBet(st.bet,true)};
$("half").onclick=function(){if(!st.busy)setBet(st.bet/2,true)};
$("dbl").onclick=function(){if(!st.busy)setBet(st.bet*2,true)};
$("clr").onclick=function(){if(!st.busy)setBet(0,true)};
$("go").onclick=play;
render();connect();
})();
</script>
</body>
</html>
